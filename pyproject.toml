[project]
name = "schoolsift"
version = "0.1.0"
description = "Every school email, turned into the next right action."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.118",
    "pydantic>=2.9,<2.13",
    "uvicorn>=0.30,<0.36",
    "pypdf>=4,<6",
    "strands-agents==1.54.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "google-auth==2.57.1",
    "cryptography>=44,<47",
    "defusedxml>=0.7.1",
    "requests>=2.34.2",
    "bedrock-agentcore==1.22.0",
    "boto3==1.43.89",
    "PyJWT==2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<0.14",
    "mypy>=1.11,<1.19",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/schoolsift"]

[tool.uv]
package = true
constraint-dependencies = [
    "boto3==1.43.89",
    "botocore==1.43.89",
    "pyjwt==2.13.0",
    "wrapt==2.4.0",
    "mcp==1.29.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.mypy]
mypy_path = "backend/src"
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "schoolsift.agent"
warn_unused_ignores = false

[tool.ruff]
target-version = "py312"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
"backend/src/schoolsift/sqlite_store.py" = ["S608"]
